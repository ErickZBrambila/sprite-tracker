<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sprite Tracker · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0e17; --panel: #131926; --panel-2: #1a2233;
    --border: #2a3450; --text: #eef1f8; --muted: #8b93a7;
    --accent: #8b6cff; --accent-2: #22d3ee;
    --rare: #4fa8ff; --epic: #c46bff; --legendary: #ff9f43; --mythic: #ffd95a;
    --green: #2ecc71; --danger: #ff5c7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }

  /* Auth gate */
  #authGate {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .auth-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 36px; max-width: 360px; width: 100%; text-align: center;
  }
  .auth-card h2 { margin-bottom: 8px; }
  .auth-card p { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .auth-row { display: flex; gap: 8px; }
  .auth-row input {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; color: var(--text); font: inherit;
  }
  .auth-row input:focus { outline: none; border-color: var(--accent); }
  .btn {
    background: var(--accent); border: none; border-radius: 8px;
    padding: 10px 20px; color: white; font: inherit; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  .btn:hover { filter: brightness(1.1); }

  /* Main layout */
  #dashboard { display: none; padding: 28px; max-width: 1100px; margin: 0 auto; }
  .dash-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
  }
  .dash-title { font-size: 22px; }
  .dash-meta { font-size: 12px; color: var(--muted); }
  .dash-meta span { color: var(--accent); }
  .refresh-btn {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 16px; color: var(--muted);
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .refresh-btn:hover { color: var(--text); border-color: var(--accent); }

  /* Stat cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px;
  }
  .card-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .card-value { font-family: 'Space Grotesk', sans-serif; font-size: 36px; font-weight: 700; line-height: 1; }
  .card-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .card-sub b { color: var(--green); }
  .card--accent  { border-color: rgba(139,108,255,0.4); }
  .card--green   { border-color: rgba(46,204,113,0.4);  }
  .card--blue    { border-color: rgba(79,168,255,0.4);  }
  .card--gold    { border-color: rgba(255,159,67,0.4);  }
  .card--accent .card-value { color: var(--accent); }
  .card--green  .card-value { color: var(--green);  }
  .card--blue   .card-value { color: var(--rare);   }
  .card--gold   .card-value { color: var(--legendary); }

  /* Charts */
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
  @media (max-width: 700px) { .charts { grid-template-columns: 1fr; } }
  .chart-panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px;
  }
  .chart-panel h3 { font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: .06em; }
  .chart-wrap { position: relative; height: 220px; }

  .error-msg { color: var(--danger); font-size: 13px; padding: 20px; text-align: center; }
</style>
</head>
<body>

<div id="authGate">
  <div class="auth-card">
    <h2>◆ Admin</h2>
    <p>Enter your stats key to view the dashboard.</p>
    <div class="auth-row">
      <input type="password" id="keyInput" placeholder="Stats key" autocomplete="off" />
      <button class="btn" id="unlockBtn">View</button>
    </div>
    <p id="authError" style="color:var(--danger);margin-top:12px;font-size:12px;"></p>
  </div>
</div>

<div id="dashboard">
  <div class="dash-header">
    <div>
      <h1 class="dash-title">◆ Sprite Tracker · Stats</h1>
      <p class="dash-meta">Last refreshed: <span id="lastRefreshed">—</span></p>
    </div>
    <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
  </div>

  <div class="cards">
    <div class="card card--accent">
      <div class="card-label">Total Users</div>
      <div class="card-value" id="statTotal">—</div>
      <div class="card-sub" id="statTotalSub"></div>
    </div>
    <div class="card card--green">
      <div class="card-label">Active Users</div>
      <div class="card-value" id="statActive">—</div>
      <div class="card-sub" id="statActiveSub"></div>
    </div>
    <div class="card card--blue">
      <div class="card-label">Total Toggles</div>
      <div class="card-value" id="statEvents">—</div>
      <div class="card-sub" id="statEventsSub"></div>
    </div>
    <div class="card card--gold">
      <div class="card-label">New This Week</div>
      <div class="card-value" id="statNew7d">—</div>
      <div class="card-sub" id="statNew7dSub"></div>
    </div>
  </div>

  <div class="charts">
    <div class="chart-panel">
      <h3>New Users · Last 14 Days</h3>
      <div class="chart-wrap"><canvas id="signupChart"></canvas></div>
    </div>
    <div class="chart-panel">
      <h3>Top 10 Sprites Collected</h3>
      <div class="chart-wrap"><canvas id="spritesChart"></canvas></div>
    </div>
  </div>

  <div id="errorMsg"></div>
</div>

<script>
const KEY_STORAGE = 'sprite-admin-key';
let statsKey = sessionStorage.getItem(KEY_STORAGE) || '';
let signupChart, spritesChart;

Chart.defaults.color = '#8b93a7';
Chart.defaults.borderColor = '#2a3450';
Chart.defaults.font.family = 'Inter, sans-serif';

// Auth
document.getElementById('unlockBtn').onclick = tryUnlock;
document.getElementById('keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

async function tryUnlock() {
  const key = document.getElementById('keyInput').value.trim();
  const res = await fetch(`/api/stats${key ? '?key=' + encodeURIComponent(key) : ''}`);
  if (res.status === 401) {
    document.getElementById('authError').textContent = 'Wrong key — try again.';
    return;
  }
  if (!res.ok) {
    document.getElementById('authError').textContent = 'Server error. Try again.';
    return;
  }
  statsKey = key;
  sessionStorage.setItem(KEY_STORAGE, key);
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  renderData(await res.json());
}

// If key already in session, skip auth gate
if (statsKey !== '') {
  fetch(`/api/stats${statsKey ? '?key=' + encodeURIComponent(statsKey) : ''}`)
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (data) {
        document.getElementById('authGate').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        renderData(data);
      } else {
        sessionStorage.removeItem(KEY_STORAGE);
        statsKey = '';
      }
    });
}

document.getElementById('refreshBtn').onclick = async () => {
  const res = await fetch(`/api/stats${statsKey ? '?key=' + encodeURIComponent(statsKey) : ''}`);
  if (res.ok) renderData(await res.json());
};

function renderData(d) {
  // Stat cards
  document.getElementById('statTotal').textContent   = d.devices.total;
  document.getElementById('statActive').textContent  = d.devices.active;
  document.getElementById('statEvents').textContent  = fmtNum(d.events.total);
  document.getElementById('statNew7d').textContent   = d.devices.new_7d;

  document.getElementById('statTotalSub').innerHTML  = `<b>${d.devices.named}</b> named · ${d.devices.new_30d} this month`;
  document.getElementById('statActiveSub').innerHTML = `${pct(d.devices.active, d.devices.total)}% of total registered`;
  document.getElementById('statEventsSub').innerHTML = `<b>${fmtNum(d.events.last_24h)}</b> today · ${fmtNum(d.events.last_7d)} this week`;
  document.getElementById('statNew7dSub').innerHTML  = `${d.devices.new_30d} this month`;

  document.getElementById('lastRefreshed').textContent = new Date().toLocaleTimeString();

  renderSignupChart(d.daily_signups);
  renderSpritesChart(d.top_sprites);
}

function renderSignupChart(daily) {
  const labels = daily.map(d => {
    const [, m, day] = d.day.split('-');
    return `${m}/${day}`;
  });
  const data = daily.map(d => d.count);

  if (signupChart) signupChart.destroy();
  signupChart = new Chart(document.getElementById('signupChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: 'rgba(139,108,255,0.5)',
        borderColor: 'rgba(139,108,255,0.9)',
        borderWidth: 1,
        borderRadius: 4,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } },
      },
    },
  });
}

function renderSpritesChart(sprites) {
  const labels = sprites.map(s => s.id.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase()));
  const data   = sprites.map(s => s.toggles);
  const colors = [
    '#8b6cff','#6cb3ff','#c46bff','#ff9f43','#22d3ee',
    '#2ecc71','#ffd95a','#ff5c7a','#4fa8ff','#e67e22',
  ];

  if (spritesChart) spritesChart.destroy();
  spritesChart = new Chart(document.getElementById('spritesChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: colors.map(c => c + '99'),
        borderColor: colors,
        borderWidth: 1,
        borderRadius: 4,
      }],
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } },
        y: { grid: { display: false }, ticks: { font: { size: 11 } } },
      },
    },
  });
}

function pct(a, b) { return b === 0 ? 0 : Math.round((a / b) * 100); }
function fmtNum(n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : n; }
</script>
</body>
</html>
